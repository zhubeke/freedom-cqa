[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cqa-audio-worker"
version = "2.0.0"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.8.0", "torchaudio==2.8.0", "torchcodec==0.7.0", "pyannote.audio==4.0.7",
  "confluent-kafka==2.6.1", "pymongo==4.10.1", "pydantic==2.10.6", "httpx==0.28.1",
  "beautifulsoup4==4.12.3", "lxml==5.3.0", "soundfile==0.13.1", "librosa==0.10.2.post1",
  "numpy==2.0.2", "scipy==1.14.1", "fastapi==0.115.8", "uvicorn==0.34.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_model: opt-in test requiring cached Community-1 model", "integration: tests requiring infrastructure"]
